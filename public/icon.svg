<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="topSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- iOS / Apple Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#brandGradient)"/>

  <!-- Subtle Inner Specular Rim Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Central Emblem: Bits & Tools Stacked Layers -->
  <g id="brandSymbol">
    <!-- Bottom Layer Chevron -->
    <polyline points="116,356 256,430 396,356" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Middle Layer Chevron -->
    <polyline points="116,276 256,350 396,276" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Floating Layer with Depth Shadow -->
    <g filter="url(#layerShadow)">
      <polygon points="256,116 396,190 256,264 116,190" fill="url(#topSurface)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
      
      <!-- Central Geometric "Bit" Utility Socket -->
      <polygon points="256,156 312,190 256,224 200,190" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="256" cy="190" r="10" fill="#2563eb"/>
    </g>
  </g>
</svg>
